<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80" fill="none">
  <defs>
    <!-- Background subtle gradient -->
    <radialGradient id="bannerGlow" cx="15%" cy="50%" r="50%" fx="15%" fy="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#4F46E5" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070A10" stop-opacity="0" />
    </radialGradient>

    <!-- Outer shield / cyber ring gradient -->
    <linearGradient id="bShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Globe grid gradient -->
    <linearGradient id="bGlobeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- X neon accent -->
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Neon stroke filter -->
    <filter id="bGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow behind the logo emblem -->
  <rect x="0" y="0" width="420" height="80" rx="8" fill="#0A0E17" />
  <circle cx="48" cy="40" r="38" fill="url(#bannerGlow)" />

  <!-- EMBLEM ICON (Left aligned at cx=48, cy=40, scaled) -->
  <g transform="translate(16, 8) scale(1)">
    <!-- Outer Cyber Hexagon Base -->
    <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" 
             stroke="url(#bShieldGrad)" 
             stroke-width="2.2" 
             fill="#090D16" 
             stroke-linejoin="round" />

    <!-- Inner Cyber Tech Frame Accent -->
    <polygon points="32,8 54,20 54,44 32,56 10,44 10,20" 
             stroke="#38BDF8" 
             stroke-opacity="0.3" 
             stroke-width="1" 
             fill="none" 
             stroke-dasharray="4 2" />

    <!-- Global Network Grid / Latitude & Longitude lines -->
    <circle cx="32" cy="32" r="19" stroke="url(#bGlobeGrad)" stroke-width="1.4" fill="none" opacity="0.85" />
    <ellipse cx="32" cy="32" rx="10" ry="19" stroke="url(#bGlobeGrad)" stroke-width="1.1" fill="none" opacity="0.65" />
    <line x1="32" y1="13" x2="32" y2="51" stroke="url(#bGlobeGrad)" stroke-width="1.1" stroke-dasharray="2 2" opacity="0.5" />
    <line x1="13" y1="32" x2="51" y2="32" stroke="url(#bGlobeGrad)" stroke-width="1.1" opacity="0.65" />
    <ellipse cx="32" cy="24" rx="16" ry="5.5" stroke="url(#bGlobeGrad)" stroke-width="0.9" fill="none" opacity="0.4" />
    <ellipse cx="32" cy="40" rx="16" ry="5.5" stroke="url(#bGlobeGrad)" stroke-width="0.9" fill="none" opacity="0.4" />

    <!-- Network Nodes -->
    <circle cx="22" cy="24" r="1.6" fill="#00F0FF" filter="url(#bGlow)" />
    <circle cx="42" cy="24" r="1.6" fill="#00F0FF" filter="url(#bGlow)" />
    <circle cx="20" cy="40" r="1.6" fill="#A855F7" />
    <circle cx="44" cy="40" r="1.6" fill="#A855F7" />

    <!-- Foreground Email Envelope & Forensic Core -->
    <g filter="url(#bGlow)">
      <rect x="18" y="22" width="28" height="20" rx="3" fill="#0F172A" stroke="#06B6D4" stroke-width="1.8" />
      <path d="M18 24 L32 34 L46 24" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="32" cy="33" r="4.5" fill="#090D16" stroke="#10B981" stroke-width="1.4" />
      <circle cx="32" cy="32.2" r="1.2" fill="#34D399" />
      <path d="M31.4 33.2 L32.6 33.2 L32.8 35.5 L31.2 35.5 Z" fill="#34D399" />
    </g>

    <!-- Corner Accents -->
    <path d="M6 24 L6 18 L12 18" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M58 24 L58 18 L52 18" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M6 40 L6 46 L12 46" stroke="#A855F7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M58 40 L58 46 L52 46" stroke="#A855F7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- BRAND TYPOGRAPHY (Right of emblem) -->
  <g transform="translate(94, 0)">
    <!-- Primary Title -->
    <text x="0" y="38" font-family="'JetBrains Mono', 'Inter', -apple-system, sans-serif" font-size="22" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      SecureMailScope
    </text>
    <!-- Cyan X Marker -->
    <text x="210" y="38" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="900" fill="url(#xGrad)" filter="url(#bGlow)">
      X
    </text>

    <!-- Subtitle / Tagline -->
    <text x="1" y="55" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#94A3B8" letter-spacing="1.5">
      CRYPTOGRAPHIC FORENSICS
    </text>

    <!-- Category / Engine Pill Badge -->
    <rect x="180" y="45" width="135" height="14" rx="3" fill="#0D1527" stroke="#1E293B" stroke-width="1" />
    <text x="186" y="55.5" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#06B6D4" letter-spacing="0.5">
      PQC &amp; HNDL AUDIT ENGINE
    </text>
  </g>
</svg>
