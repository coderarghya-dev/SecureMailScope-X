  <circle cx="32" cy="32" r="19" stroke="url(#globeGrad)" stroke-width="1.4" fill="none" opacity="0.85" />
  <ellipse cx="32" cy="32" rx="10" ry="19" stroke="url(#globeGrad)" stroke-width="1.1" fill="none" opacity="0.65" />
  <line x1="32" y1="13" x2="32" y2="51" stroke="url(#globeGrad)" stroke-width="1.1" stroke-dasharray="2 2" opacity="0.5" />
  <line x1="13" y1="32" x2="51" y2="32" stroke="url(#globeGrad)" stroke-width="1.1" opacity="0.65" />
  <ellipse cx="32" cy="24" rx="16" ry="5.5" stroke="url(#globeGrad)" stroke-width="0.9" fill="none" opacity="0.4" />
