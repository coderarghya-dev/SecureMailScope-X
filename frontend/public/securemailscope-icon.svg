  <circle cx="42" cy="24" r="1.6" fill="#00F0FF" filter="url(#cyanGlow)" />
  <circle cx="20" cy="40" r="1.6" fill="#A855F7" />
  <circle cx="44" cy="40" r="1.6" fill="#A855F7" />
  <circle cx="32" cy="13" r="1.8" fill="#38BDF8" />
  <circle cx="32" cy="51" r="1.8" fill="#38BDF8" />

